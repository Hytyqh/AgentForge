[project]
name = "agentforge"
version = "0.1.0"
description = "自研 Agent 平台：手写 ReAct 循环、工具注册、RAG、记忆、任务调度、HITL、MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
]

[project.scripts]
agentforge = "agentforge.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
